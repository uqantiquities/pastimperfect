<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artefact Explorer</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            width: 100%;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: 1px;
            text-transform: lowercase;
            color: #f0f0f0;
        }

        hr {
            width: 100%;
            max-width: 1200px;
            border: none;
            border-top: 1px solid #3a3a3a;
            margin-bottom: 30px;
        }

        .description {
            font-size: 20pt;
            line-height: 1.6;
            color: #ffffff;
            text-align: center;
            max-width: 1000px;
            margin-bottom: 50px;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 40px;
            max-width: 1200px;
            width: 100%;
        }

        .card {
            display: block;
            text-decoration: none;
            background-color: #2a2a2a;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            border: 1px solid #3a3a3a;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            border-color: #5a5a5a;
        }

        .card:focus-visible {
            outline: 2px solid #ffffff;
            outline-offset: 4px;
        }

        .card img {
            width: 100%;
            height: 220px;
            object-fit: contain;
            display: block;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: 500;
            color: #ffffff;
        }

        footer {
            margin-top: auto;
            padding: 50px 10px 10px;
            text-align: center;
            color: #ffffff;
            font-family: Arial, sans-serif;
            font-size: 10pt;
            line-height: 1.5;
        }

        /* Tablet and smaller screens */
        @media (max-width: 900px) {
            .container {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 25px;
            }

            .card img {
                height: 200px;
            }
        }

        /* Mobile screens */
        @media (max-width: 480px) {
            body {
                padding: 25px 15px;
            }

            h1 {
                font-size: 2rem;
            }

            .description {
                font-size: 20pt;
                margin-bottom: 35px;
            }

            .container {
                gap: 15px;
            }

            .card {
                padding: 15px;
            }

            .card img {
                height: 150px;
            }

            .card-title {
                font-size: 1.1rem;
            }
        }

        /* Landscape iPad */
        @media (orientation: landscape)
            and (min-width: 768px)
            and (max-width: 1024px) {
            body {
                padding: 20px;
            }

            .container {
                gap: 25px;
            }

            .card {
                padding: 20px;
            }

            .card img {
                height: 160px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>title</h1>
    </header>

    <hr>

    <p class="description">
        Lorem ipsum dolor sit amet, consectetur adipiscing elit.
        Sed do eiusmod tempor incididunt ut labore et dolore.
    </p>

    <main class="container">

        <!-- Vase 1: replace vase1.jpg with your image -->
        <a class="card" href="page1.html">
            <img src="vase1.jpg" alt="Vase 1">
            <h2 class="card-title">vase 1</h2>
        </a>

        <!-- Vase 2: replace vase2.jpg with your image -->
        <a class="card" href="page2.html">
            <img src="vase2.jpg" alt="Vase 2">
            <h2 class="card-title">vase 2</h2>
        </a>

        <!-- Vase 3: replace vase3.jpg with your image -->
        <a class="card" href="page3.html">
            <img src="vase3.jpg" alt="Vase 3">
            <h2 class="card-title">vase 3</h2>
        </a>

        <!-- Vase 4: replace vase4.jpg with your image -->
        <a class="card" href="page4.html">
            <img src="vase4.jpg" alt="Vase 4">
            <h2 class="card-title">vase 4</h2>
        </a>

    </main>

    <footer>
        Lorem ipsum dolor sit amet, consectetur adipiscing elit,
        sed do eiusmod tempor incididunt ut labore.
    </footer>

</body>
</html>
