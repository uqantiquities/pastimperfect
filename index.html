<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artefact Explorer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 60px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: 1px;
            text-transform: lowercase;
            color: #f0f0f0;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 40px;
            max-width: 1200px;
            width: 100%;
        }

        .card {
            background-color: #2a2a2a;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            border: 1px solid #3a3a3a;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            border-color: #5a5a5a;
        }

        .card-graphic {
            font-size: 80px;
            margin-bottom: 20px;
            display: block;
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: 500;
            color: #ffffff;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            animation: fadeIn 0.3s ease;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .modal-content {
            background-color: #2a2a2a;
            padding: 40px;
            border-radius: 12px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            animation: slideIn 0.3s ease;
            border: 1px solid #3a3a3a;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .close-btn {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
            margin-top: -10px;
        }

        .close-btn:hover,
        .close-btn:focus {
            color: #ffffff;
        }

        .modal-graphic {
            font-size: 120px;
            margin: 20px 0;
            display: block;
        }

        .modal-title {
            font-size: 2rem;
            font-weight: 500;
            margin: 20px 0;
            color: #ffffff;
        }

        .modal-text {
            font-size: 1rem;
            line-height: 1.6;
            color: #cccccc;
            margin-top: 15px;
        }

        /* Landscape iPad specific */
        @media (orientation: landscape) and (max-width: 1024px) {
            body {
                padding: 20px;
            }

            h1 {
                font-size: 2rem;
                margin-bottom: 30px;
            }

            .container {
                gap: 30px;
            }

            .card {
                padding: 20px;
            }

            .card-graphic {
                font-size: 60px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>select an artefact to explore</h1>
    </header>

    <div class="container">
        <!-- Card 1 -->
        <div class="card" onclick="openModal(1)">
            <span class="card-graphic">☕</span>
            <h2 class="card-title">cup 1</h2>
        </div>

        <!-- Card 2 -->
        <div class="card" onclick="openModal(2)">
            <span class="card-graphic">☕</span>
            <h2 class="card-title">cup 2</h2>
        </div>

        <!-- Card 3 -->
        <div class="card" onclick="openModal(3)">
            <span class="card-graphic">☕</span>
            <h2 class="card-title">cup 3</h2>
        </div>
    </div>

    <!-- Modal 1 -->
    <div class="modal" id="modal1" onclick="closeModal(1)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="close-btn" onclick="closeModal(1)">&times;</button>
            <span class="modal-graphic">☕</span>
            <h2 class="modal-title">cup 1</h2>
            <p class="modal-text">lorem ipsum dolorent postque ciceronibus.</p>
        </div>
    </div>

    <!-- Modal 2 -->
    <div class="modal" id="modal2" onclick="closeModal(2)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="close-btn" onclick="closeModal(2)">&times;</button>
            <span class="modal-graphic">☕</span>
            <h2 class="modal-title">cup 2</h2>
            <p class="modal-text">lorem ipsum dolorent postque ciceronibus.</p>
        </div>
    </div>

    <!-- Modal 3 -->
    <div class="modal" id="modal3" onclick="closeModal(3)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="close-btn" onclick="closeModal(3)">&times;</button>
            <span class="modal-graphic">☕</span>
            <h2 class="modal-title">cup 3</h2>
            <p class="modal-text">lorem ipsum dolorent postque ciceronibus.</p>
        </div>
    </div>

    <script>
        function openModal(cupNumber) {
            document.getElementById('modal' + cupNumber).classList.add('active');
        }

        function closeModal(cupNumber) {
            document.getElementById('modal' + cupNumber).classList.remove('active');
        }

        // Close modal when pressing Escape key
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                for (let i = 1; i <= 3; i++) {
                    document.getElementById('modal' + i).classList.remove('active');
                }
            }
        });
    </script>
</body>
</html>
