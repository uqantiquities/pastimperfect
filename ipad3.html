
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artefact Explorer</title>

<link href="https://fonts.googleapis.com/css?family=Montserrat:400,500,700,800,900"
      rel="stylesheet">

<style>

/* GENERAL RESET */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* TYPOGRAPHY */

body {
    background-color: #dddbdc;
    color: #3a383a;
    font-family: 'Montserrat', 'Helvetica Neue',
                 Helvetica, Arial, sans-serif;
    font-weight: 400;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 25px 30px;
}

h1 {
    font-family: 'Montserrat', sans-serif;
    font-size: 2rem;
    font-weight: 900;
    letter-spacing: 0.5px;
    line-height: 1.2;
    text-align: center;
    margin-bottom: 5px;
}

h2 {
    font-family: 'Montserrat', sans-serif;
    font-size: 1.5rem;
    font-weight: 900;
    letter-spacing: 0.5px;
    line-height: 1.0;
    text-align: center;
    margin-bottom: 20px;
}

/* BODY COPY */

.description {
    font-size: 16pt;
    font-weight: 400;
    line-height: 1.5;
    text-align: center;
    max-width: 950px;
    margin-bottom: 5px;
}

.citation {
    font-size: 12pt;
    text-align: center;
    margin-bottom: 30px;
}

/* CATEGORY HEADINGS */

.left-column > p,
.category-row > p {
    font-size: 1.35rem;
    font-weight: 800;
    line-height: 1.3;
    margin-bottom: 18px;
    text-align: center;
}

/* FOOTER */

footer {
    font-size: 10pt;
    margin-top: auto;
    padding: 30px 10px 5px;
    text-align: center;
    color: #3a383a;
}

hr {
    width: 100%;
    max-width: 1200px;
    border: none;
    border-top: 1px solid #3a383a;
    margin-bottom: 18px;
}

/* MAIN LAYOUT */

/* Flexbox replaces newer layout dependencies */

.container {
    display: flex;
    width: 100%;
    max-width: 1200px;
    align-items: flex-start;
}

.left-column {
    width: 25%;
    text-align: center;
    padding-right: 30px;
}

.right-column {
    width: 75%;
    display: flex;
    flex-direction: column;
}

.category-row {
    width: 100%;
    text-align: center;
    margin-bottom: 32px;
}

/* THUMBNAIL GRIDS */

.modal-grid {
    display: flex;
    justify-content: center;
    align-items: flex-start;
}

/* SCULPTURES */

.left-column .modal-grid {
    flex-direction: column;
    align-items: center;
}

.left-column .modal-trigger {
    width: 100%;
    max-width: 180px;
    margin-bottom: 18px;
}

/* VESSELS */

.category-row:first-child .modal-grid {
    width: 28.57%;
    margin-left: auto;
    margin-right: auto;
}

.category-row:first-child .modal-trigger {
    width: 50%;
}

/* LAMPS */

.category-row:last-child .modal-grid {
    width: 42.86%;
    margin-left: auto;
    margin-right: auto;
}

.category-row:last-child .modal-trigger {
    width: 33.333%;
}

/* THUMBNAIL BUTTONS */

/* Fixed height provides an aspect-ratio fallback */

.modal-trigger {
    position: relative;
    height: 150px;
    min-width: 0;
    padding: 5px;
    margin-right: 5px;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 0 solid #3a383a;
    border-radius: 8px;
    background-color: #393739;

    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;

    transition: all 0.3s ease;

    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
}

.modal-trigger:hover {
    transform: translateY(-4px);
    box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
}

.modal-trigger:focus {
    outline: 2px solid #393739;
    outline-offset: 3px;
}

.modal-trigger img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    background-color: #dddbdc;
    border-radius: 4px;
}

/* RESPONSIVE IMAGE MODAL */

/*
   IMPORTANT:
   Explicit positioning is used instead of inset.
   This supports older versions of iOS Safari.
*/

.modal {
    display: none;
    position: fixed;

    top: 0;
    right: 0;
    bottom: 0;
    left: 0;

    z-index: 10000;

    background-color: rgba(30, 29, 30, 0.92);

    padding: 4vh 4vw;

    /* Safari compatibility */
    -webkit-overflow-scrolling: touch;
}

/* OPEN MODAL */

.modal.active {
    display: block;
}

/* MODAL IMAGE CONTAINER */

.modal-content {
    position: absolute;

    top: 50%;
    left: 50%;

    width: 92%;
    height: 82%;

    max-width: 1100px;
    max-height: 82vh;

    /* Older Safari centering */
    -webkit-transform: translate(-50%, -50%);
    transform: translate(-50%, -50%);

    text-align: center;
}

/* MODAL IMAGE */

.modal-content img {
    display: block;

    position: absolute;

    top: 50%;
    left: 50%;

    width: 100%;
    height: 100%;

    max-width: 100%;
    max-height: 100%;

    object-fit: contain;
    object-position: center;

    -webkit-transform: translate(-50%, -50%);
    transform: translate(-50%, -50%);
}

/* CLOSE BUTTON */

.close-modal {
    position: absolute;

    top: 10px;
    right: 10px;

    background: rgba(30, 29, 30, 0.85);
    border: none;
    border-radius: 50%;

    width: 44px;
    height: 44px;

    color: white;
    font-size: 32px;
    font-weight: 300;

    display: block;

    line-height: 40px;
    text-align: center;

    cursor: pointer;
    z-index: 10001;

    -webkit-appearance: none;
    appearance: none;
}

/* PREVENT BACKGROUND SCROLL */

body.modal-open {
    overflow: hidden;
    position: fixed;
    width: 100%;
}

/* IPAD LANDSCAPE AND PORTRAIT */

@media screen and (min-width: 600px) {

    .modal {
        padding: 5vh 5vw;
    }

    .modal-content {
        width: 90%;
        height: 82%;
        max-width: 1000px;
    }
}

/* SMALLER SCREENS */

@media screen and (max-width: 599px) {

    .modal {
        padding: 5vh 4vw;
    }

    .modal-content {
        width: 92%;
        height: 85%;
    }

    .close-modal {
        top: 5px;
        right: 5px;
    }
}

/* STANDARD IPAD LANDSCAPE */

@media screen
and (min-width: 768px)
and (max-width: 1100px)
and (orientation: landscape) {

    body {
        padding: 18px 24px;
    }

    header {
        margin-bottom: 12px;
    }

    h1 {
        font-size: 1.7rem;
    }

    hr {
        margin-bottom: 12px;
    }

    .description {
        font-size: 14pt;
    }

    .citation {
        font-size: 11pt;
        margin-bottom: 23px;
    }

    .left-column {
        width: 21%;
        padding-right: 24px;
    }

    .right-column {
        width: 79%;
    }

    .category-row {
        margin-bottom: 25px;
    }

    .left-column .modal-trigger {
        max-width: 160px;
        height: 140px;
    }

    .category-row:first-child .modal-grid {
        width: 28.57%;
    }

    .category-row:last-child .modal-grid {
        width: 42.86%;
    }

    .modal-trigger {
        padding: 5px;
        border-radius: 7px;
    }

    footer {
        padding-top: 20px;
    }
}

/* IPAD PORTRAIT */

@media screen
and (min-width: 600px)
and (max-width: 900px)
and (orientation: portrait) {

    .container {
        flex-direction: column;
    }

    .left-column {
        width: 100%;
        padding-right: 0;
        margin-bottom: 35px;
    }

    .left-column .modal-grid {
        flex-direction: row;
        justify-content: center;
    }

    .left-column .modal-trigger {
        width: 130px;
        height: 130px;
        margin: 0 8px;
    }

    .right-column {
        width: 100%;
    }

    .category-row:first-child .modal-grid {
        width: 50%;
    }

    .category-row:last-child .modal-grid {
        width: 66.67%;
    }

    .category-row {
        margin-bottom: 30px;
    }
}

/* MOBILE */

@media screen and (max-width: 599px) {

    body {
        padding: 22px 15px;
    }

    h1 {
        font-size: 1.7rem;
    }

    .description {
        font-size: 13pt;
    }

    .citation {
        font-size: 10pt;
        margin-bottom: 25px;
    }

    .container {
        flex-direction: column;
    }

    .left-column {
        width: 100%;
        padding-right: 0;
        margin-bottom: 35px;
    }

    .left-column .modal-grid {
        flex-direction: row;
        justify-content: center;
    }

    .left-column .modal-trigger {
        width: 100px;
        height: 100px;
        margin: 0 5px;
    }

    .right-column {
        width: 100%;
    }

    .category-row:first-child .modal-grid {
        width: 66.67%;
    }

    .category-row:last-child .modal-grid {
        width: 100%;
    }

    .category-row {
        margin-bottom: 30px;
    }

    .left-column h2,
    .category-row h2 {
        font-size: 1.2rem;
    }

    .modal-trigger {
        padding: 5px;
    }

    footer {
        padding-top: 25px;
    }
}

/* BUTTON FONT */

button,
input,
textarea,
select {
    font-family: 'Montserrat', sans-serif;
}

</style>
</head>

<body>

<header>
    <h1>Ancient or Modern?</h1>
    <h2>Click on each object to find out</h2>
</header>

<p class="description">
    "…a copy was made, differing in no respect from the original,
    and exposed to public view, on purpose to deceive those who
    might be planning to steal it…"
</p>

<p class="citation">
    Dionysius of Halicarnassus, Roman Antiquities 1.69.3
</p>

<main class="container">

    <!-- SCULPTURES -->

    <section class="left-column">

        <p>Sculptures</p>

        <div class="modal-grid">

            <button class="modal-trigger"
                data-image="images/head1.png"
                aria-label="View Sculpture 1">

                <img src="images/head1-thumb.png"
                     alt="Sculpture 1">

            </button>

            <button class="modal-trigger"
                data-image="images/head2.png"
                aria-label="View Sculpture 2">

                <img src="images/head2-thumb.png"
                     alt="Sculpture 2">

            </button>

        </div>

    </section>

    <!-- RIGHT COLUMN -->

    <section class="right-column">

        <!-- VESSELS -->

        <div class="category-row">

            <p>Vessels</p>

            <div class="modal-grid">

                <button class="modal-trigger"
                    data-image="images/amphora1.png"
                    aria-label="View Vessel 1">

                    <img src="images/amphora1-thumb.png"
                         alt="Vessel 1">

                </button>

                <button class="modal-trigger"
                    data-image="images/amphora2.png"
                    aria-label="View Vessel 2">

                    <img src="images/amphora2-thumb.png"
                         alt="Vessel 2">

                </button>

            </div>

        </div>

        <!-- LAMPS -->

        <div class="category-row">

            <p>Lamps</p>

            <div class="modal-grid">

                <button class="modal-trigger"
                    data-image="images/lamp1.png"
                    aria-label="View Lamp 1">

                    <img src="images/lamp1-thumb.png"
                         alt="Lamp 1">

                </button>

                <button class="modal-trigger"
                    data-image="images/lamp2.png"
                    aria-label="View Lamp 2">

                    <img src="images/lamp2-thumb.png"
                         alt="Lamp 2">

                </button>

                <button class="modal-trigger"
                    data-image="images/lamp3.png"
                    aria-label="View Lamp 3">

                    <img src="images/lamp3-thumb.png"
                         alt="Lamp 3">

                </button>

            </div>

        </div>

    </section>

</main>

<!-- SHARED IMAGE MODAL -->

<div class="modal" id="imageModal"
     role="dialog"
     aria-label="Artefact image viewer">

    <div class="modal-content">

        <button class="close-modal"
                id="closeModal"
                aria-label="Close image viewer">

            &times;

        </button>

        <img id="modalImage"
             src=""
             alt="Enlarged artefact image">

    </div>

</div>

<footer>
</footer>

<script>

/*
   IOS 10.3.3 COMPATIBLE MODAL JAVASCRIPT

   Uses ES5 syntax for older Safari.
   Avoids:
   - const
   - let
   - arrow functions
   - NodeList.forEach
   - dataset
   - event.key
*/

/* GET PAGE ELEMENTS */

var modal = document.getElementById('imageModal');

var modalImage = document.getElementById('modalImage');

var closeButton = document.getElementById('closeModal');

var triggers = document.querySelectorAll('.modal-trigger');

var previouslyFocused = null;

var previousScrollPosition = 0;


/* OPEN MODAL */

function openModal(trigger) {

    if (!trigger) {
        return;
    }

    previouslyFocused = document.activeElement;

    /* Save current scroll position */

    previousScrollPosition =
        window.pageYOffset ||
        document.documentElement.scrollTop ||
        0;

    /* Get image path using older Safari-compatible method */

    var imagePath = trigger.getAttribute('data-image');

    if (!imagePath) {
        return;
    }

    /* Load enlarged image */

    modalImage.src = imagePath;

    /* Display modal */

    modal.classList.add('active');

    document.body.classList.add('modal-open');

    /* Lock background scroll */

    document.body.style.top =
        '-' + previousScrollPosition + 'px';

    /* Move focus to close button */

    closeButton.focus();

}


/* CLOSE MODAL */

function closeModal() {

    if (!modal.classList.contains('active')) {
        return;
    }

    /* Hide modal */

    modal.classList.remove('active');

    /* Restore body scrolling */

    document.body.classList.remove('modal-open');

    document.body.style.top = '';

    /* Clear enlarged image */

    modalImage.removeAttribute('src');

    /* Restore original scroll position */

    window.scrollTo(0, previousScrollPosition);

    /* Restore keyboard focus */

    if (previouslyFocused) {

        previouslyFocused.focus();

    }

}


/* CONNECT ALL THUMBNAIL BUTTONS */

/* Traditional loop for older Safari compatibility */

for (var i = 0; i < triggers.length; i++) {

    (function(trigger) {

        trigger.addEventListener('click', function(event) {

            event.preventDefault();

            openModal(trigger);

        }, false);

    })(triggers[i]);

}


/* CLOSE BUTTON */

closeButton.addEventListener('click', function(event) {

    event.preventDefault();

    closeModal();

}, false);


/* CLOSE WHEN TAPPING OUTSIDE THE IMAGE */

modal.addEventListener('click', function(event) {

    if (event.target === modal) {

        closeModal();

    }

}, false);


/* CLOSE USING ESCAPE KEY */

document.addEventListener('keydown', function(event) {

    event = event || window.event;

    var key = event.keyCode || event.which;

    if (key === 27 &&
        modal.classList.contains('active')) {

        closeModal();

    }

}, false);


/* PREVENT BACKGROUND TOUCH SCROLL WHILE MODAL IS OPEN */

modal.addEventListener('touchmove', function(event) {

    if (event.target === modal) {

        event.preventDefault();

    }

}, false);

</script>

</body>
</html>
